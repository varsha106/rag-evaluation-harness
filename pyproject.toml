[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluation-harness"
version = "0.1.0"
description = "A transparent evaluation harness for retrieval-augmented generation systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Varsha Puli" }]
dependencies = []

[project.optional-dependencies]
frameworks = [
  "ragas>=0.2.0",
  "deepeval>=2.0.0",
  "datasets>=2.19.0",
  "langchain-community>=0.2.0",
  "sentence-transformers>=2.7.0",
]

[tool.setuptools.packages.find]
include = ["rag_eval*"]
